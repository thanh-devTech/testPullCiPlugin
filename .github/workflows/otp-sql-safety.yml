name: OTP SQL safety

on:
  pull_request:
  push:
    paths:
      - '.github/workflows/otp-sql-safety.yml'
      - 'inc/gateways/**'
      - 'inc/class-otpa-logger.php'
      - 'inc/templates/admin/logs-settings-page.php'
      - 'tests/otp-sql-safety.php'

jobs:
  sql-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php tests/otp-sql-safety.php
