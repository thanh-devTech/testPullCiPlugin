name: Backport to mainphp7

on:
  pull_request:
    types: [closed]
    branches: [master]
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Decides IF a backport is needed and WHICH commits to cherry-pick,
  # for both trigger types (merged PR, or a push containing "all:").
  # Runs on self-hosted so this step still works even when GitHub-hosted
  # runners are blocked (e.g. billing/spending-limit issues on the account).
  resolve:
    runs-on: self-hosted
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      shas: ${{ steps.resolve.outputs.shas }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_title: ${{ steps.resolve.outputs.pr_title }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      branch_slug: ${{ steps.resolve.outputs.branch_slug }}
    steps:
      - name: Figure out what (if anything) needs backporting
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const isMerged = pr.merged === true;
              const hasLabel = (pr.labels || []).some(l => l.name === 'backport-php7');
              if (!isMerged || !hasLabel) {
                core.setOutput('should_run', 'false');
                return;
              }
              const commits = await github.paginate(
                github.rest.pulls.listCommits,
                { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number }
              );
              core.setOutput('should_run', 'true');
              core.setOutput('shas', commits.map(c => c.sha).join(' '));
              core.setOutput('pr_number', String(pr.number));
              core.setOutput('pr_title', pr.title);
              core.setOutput('source_ref', `PR #${pr.number} (\`${pr.title}\`)`);
              core.setOutput('branch_slug', `pr-${pr.number}`);
              return;
            }

            if (context.eventName === 'push') {
              // Only commits whose message contains "all:" should be backported.
              const commits = (context.payload.commits || [])
                .filter(c => c.message && c.message.includes('all:'));
              if (commits.length === 0) {
                core.setOutput('should_run', 'false');
                return;
              }
              const shas = commits.map(c => c.id);
              const branchName = context.payload.ref.replace('refs/heads/', '');
              core.setOutput('should_run', 'true');
              core.setOutput('shas', shas.join(' '));
              core.setOutput('pr_number', '');
              core.setOutput('pr_title', `Commits with "all:" on ${branchName}`);
              core.setOutput('source_ref', `commit(s) pushed to \`${branchName}\` containing "all:"`);
              core.setOutput('branch_slug', `push-${shas[shas.length - 1].substring(0, 7)}`);
              return;
            }

            core.setOutput('should_run', 'false');

  backport:
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BACKPORT_TOKEN }}

      - name: Run backport
        uses: ./.github/actions/do-backport
        with:
          token: ${{ secrets.BACKPORT_TOKEN }}
          shas: ${{ needs.resolve.outputs.shas }}
          source_ref: ${{ needs.resolve.outputs.source_ref }}
          pr_title: ${{ needs.resolve.outputs.pr_title }}
          pr_number: ${{ needs.resolve.outputs.pr_number }}
          branch_slug: ${{ needs.resolve.outputs.branch_slug }}

  # If the ubuntu-latest run fails to even start (e.g. GitHub-hosted
  # runner blocked by billing/spending limit, or actual rate limiting),
  # retry the exact same backport on a self-hosted runner.
  backport-self-hosted-retry:
    needs: [resolve, backport]
    # `always()` is required here: by default GitHub Actions skips a job
    # whose `needs` didn't all succeed, *before* even evaluating the rest
    # of this `if`. Without always(), this job silently skips instead of
    # retrying whenever `backport` fails/cancels/doesn't start.
    if: |
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.should_run == 'true' &&
      needs.backport.result != 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BACKPORT_TOKEN }}

      - name: Run backport (retry on self-hosted runner)
        uses: ./.github/actions/do-backport
        with:
          token: ${{ secrets.BACKPORT_TOKEN }}
          shas: ${{ needs.resolve.outputs.shas }}
          source_ref: ${{ needs.resolve.outputs.source_ref }}
          pr_title: ${{ needs.resolve.outputs.pr_title }}
          pr_number: ${{ needs.resolve.outputs.pr_number }}
          branch_slug: ${{ needs.resolve.outputs.branch_slug }}
